[workspace]
members=[
    "crates/waybind",
    "crates/waybind-ctl",
    "crates/common",
]
resolver="3"

[workspace.dependencies]
common={ path="crates/common" }
clap={ version="4.6.7", features=["derive"] }
serde={ version="1.0.229", features=["derive"] }
toml="1.1.6"
dirs="7.0.0"
zbus="5.19.0"
xkbcommon-rs="0.1.2"

[profile.release]
opt-level=3
lto=true
codegen-units=1
strip=true
